name: CodSpeed Benchmarks

# Disabled: automatic runs on push/PR are turned off because the benchmarks
# weren't working reliably. Re-add the push/pull_request triggers to re-enable.
on:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    # Move the 'if' condition here!
    if: github.repository_owner == 'muhrin'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: |
          uv pip install -e .[dev]

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: uv run pytest tests/benchmarks/ --codspeed
