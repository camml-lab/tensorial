name: ci

on: [ push, pull_request ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      # 1. Properly install your dev dependencies (including pre-commit)
      - name: Install dependencies
        run: uv sync --extra dev

      # 2. Now uv run will find pre-commit in the .venv perfectly
      - name: Run pre-commit
        run: uv run pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )

  pylint:
    name: pylint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      # Installs exactly what you locked + extra dependencies instantly
      - name: Install python dependencies
        run: uv sync --extra dev

      - name: Run pylint checks
        run: |
          uv run pre-commit run --hook-stage manual pylint-with-spelling --all-files

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Automatically installs the local project in editable mode based on uv.lock
      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest --cov=tensorial --durations 0 -sv -p no:nb_regression tests/unit

      - name: Create xml coverage
        run: uv run coverage xml

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5

  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --extra docs

      # Treat warnings as errors, but report all of them rather than stopping at the first
      - name: Build docs
        env:
          JAX_PLATFORMS: cpu
        run: uv run make -C docs html SPHINXOPTS="-W --keep-going"

  publish:
    name: Publish to PyPI
    needs: [ pre-commit, pylint, tests ]
    if: >
      github.repository == 'camml-lab/tensorial' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Builds your distribution files cleanly
      - name: Build package
        run: uv build

      - uses: etils-actions/pypi-auto-publish@v1
        with:
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          parse-changelog: false
