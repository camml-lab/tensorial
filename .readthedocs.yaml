# .readthedocs.yaml
# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py

# Install the project and the docs extra with `uv sync`, so the versions come from `uv.lock` and
# match CI
python:
  install:
    - method: uv
      command: sync
      extras:
        - docs
