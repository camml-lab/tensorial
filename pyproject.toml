    'src/tensorial/gcnn/_diff.py',
    'src/tensorial/gcnn/_edgewise.py',
    'src/tensorial/gcnn/_experimental.py',
    'src/tensorial/gcnn/experimental/utils.py',
    'src/tensorial/gcnn/graph_ops.py',
    'src/tensorial/gcnn/losses.py',
    'src/tensorial/gcnn/mace.py',
    'src/tensorial/gcnn/_message_passing.py',
    'src/tensorial/gcnn/metrics/_base.py',
    'src/tensorial/gcnn/metrics/_contributions.py',
    'src/tensorial/gcnn/_modules.py',
    'src/tensorial/gcnn/nequip.py',
    'src/tensorial/gcnn/_nodewise.py',
    'src/tensorial/gcnn/_packing.py',
    'src/tensorial/gcnn/_product_basis.py',
    'src/tensorial/gcnn/random.py',
    'src/tensorial/gcnn/_spatial.py',
    'src/tensorial/geometry/distances.py',
    'src/tensorial/geometry/jax_neighbours.py',
    'src/tensorial/geometry/np_neighbours.py',
    'src/tensorial/geometry/unit_cells.py',
    'src/tensorial/mlip/calculators/ase.py',
    'src/tensorial/mlip/experimental.py',
    'src/tensorial/mlip/_forces.py',
    'src/tensorial/mlip/io/n2p2.py',
    'src/tensorial/mlip/potentials.py',
    'src/tensorial/_provides.py',
    'src/tensorial/reaxkit/config.py',
    'src/tensorial/reaxkit/evaluate.py',
    'src/tensorial/reaxkit/_module.py',
    'src/tensorial/reaxkit/train.py',
    'src/tensorial/reaxkit/utils/logging_utils.py',
    'src/tensorial/reaxkit/utils/rich_utils.py',
    'src/tensorial/reaxkit/utils/utils.py',
    'src/tensorial/signals/bases.py',
    'src/tensorial/signals/expansion.py',
    'src/tensorial/signals/functions.py',
    'src/tensorial/signals/radials.py',
    'src/tensorial/tensors.py',
    'src/tensorial/typing.py',
    'src/tensorial/utils.py',
    'tests/benchmarks/test_graph_batching.py',
