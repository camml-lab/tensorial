[build-system]
requires = ['flit_core >=3.4,<4']
build-backend = 'flit_core.buildapi'

[project]
name = 'tensorial'
dynamic = ["version", "description"]
authors = [
    { name = 'Martin Uhrin', email = 'martin@digitalbaker.net' },
]
readme = 'README.rst'
license = { file = 'LICENSE.txt' }
classifiers = [

    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = ['machine learning', 'e3nn-jax', 'physics']
requires-python = '>=3.10'
dependencies = [
    'beartype',
    'ase',
    "flax>=0.10.7",
    "hydra-core",
    "hydra-colorlog",
    'jax<0.11.2', # Control the JAX version, as previous updates have broken things
    'jaxlib<0.11.2',
    'jaxtyping',
    'jraph',
    'pytray',
    'e3nn-jax>=0.21.0',
    "equinox>=0.12.0",
    "reax>=0.7.0.dev1,<0.8",
    "requests",
    "rich",
    "typing-extensions"
]
[project.scripts]
tensorial = "tensorial.reaxkit.cli:main_cli"

[project.urls]
Home = 'https://github.com/camml-lab/tensorial'
Source = 'https://github.com/camml-lab/tensorial'

[project.optional-dependencies]
docs = [
    'docutils',
    'jupyter', # For running doc examples
    'nbsphinx', # Jupyter notebooks in docs
    'pandoc',
    'pydata_sphinx_theme',
    'sphinx',
    'sphinx-autobuild',
    'sphinx-autodoc-typehints',
    'sphinx-paramlinks',
]
dev = [
    'flit',
    'ipython',
    'pandas', # Needed because we optionally support this in some files
    'pytest',
    'pytest-cov',
    'pytest-env',
    "pytest-codspeed",
    'pre-commit',
    'pylint',
    'ruff',
    'ty==0.0.84',
    # Optional external libraries that we interact with
    "pymatgen",
]

[tool.flit.module]
name = 'tensorial'

[project.entry-points."reax.plugins.batch_sizers"]
native = "tensorial._provides:get_batch_sizers"

[tool.flit.sdist]
exclude = [
    '.github/',
    'docs/',
    'examples/',
]

[project.entry-points."reax.plugins.metrics"]
"atomic/num_species" = "tensorial.gcnn.atomic:NumSpecies"
"atomic/all_atomic_numbers" = "tensorial.gcnn.atomic:AllAtomicNumbers"
"atomic/avg_num_neighbours" = "tensorial.gcnn.atomic:AvgNumNeighbours"
"atomic/force_std" = "tensorial.gcnn.atomic:ForceStd"
"atomic/energy_per_atom_lstsq" = "tensorial.gcnn.atomic:EnergyPerAtomLstsq"
"atomic/energy_per_atom_rmse" = "tensorial.mlip.metrics:EnergyPerAtomRmse"
"atomic/energy_per_atom_mae" = "tensorial.mlip.metrics:EnergyPerAtomMae"
"atomic/force_rmse" = "tensorial.mlip.metrics:ForceRmse"
"atomic/stress_rmse" = "tensorial.mlip.metrics:StressRmse"

[tool.flynt]
line-length = 100
fail-on-change = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    '.git',
    '__pycache__',
    'dist',
    'build',
    '.venv',
    'docs',
    'data',
    'local',
    'notebooks',
    '.codspeed',
    '.idea',
]

[tool.ruff.lint]
select = [
    'E',    # pycodestyle errors
    'F',    # pyflakes
    'W',    # pycodestyle warnings
    'C90',  # mccabe complexity
    'I',    # isort
    'UP',   # pyupgrade
]
extend-ignore = [
    'E203',  # Whitespace before punctuation
    'E266',  # Too many leading '#' for block comment
    'E501',  # Line too long (handled by formatter)
    'F403',  # 'from module import *' used; unable to detect undefined names
    'F401',  # module imported but unused
    'F821',  # undefined name
    'F722',  # error message is string constant
    'UP037', # Remove quotes from type annotation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ty.src]
# TODO: These files have outstanding ty errors, remove them from this list as they are fixed
