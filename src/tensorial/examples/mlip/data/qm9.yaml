# summary: QM9 small organic molecules, 10k-molecule subset by default; energy (U0)
# QM9 (Ramakrishnan et al., 2014): ~134k small organic molecules (up to 9 heavy atoms of
# C, N, O, F) with DFT (B3LYP/6-31G(2df,p)) properties.  Trains on the internal energy at
# 0 K (U0); there are no forces.  Downloaded on first use into ${paths.data_dir}.
# Only the first 10,000 molecules are used by default, randomly split 85/5/10.  Use all of
# them with:
#   data_limit=null
_target_: tensorial.gcnn.data.GraphDataModule.from_random_split
dataset:
  _target_: tensorial.datasets.Qm9
  data_dir: ${paths.data_dir}
  limit: ${oc.select:data_limit,10000}
  as_graphs:
    r_max: ${r_max}
    graph_attrs:
      - [U0, energy]

batch_size: 32
train_val_test_split: [ 0.85, 0.05, 0.1 ]
